[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-san"
version = "0.1.0"
description = "Indicadores de segurança alimentar e nutricional no Brasil, e uma medida de quanto os dados públicos permitem acompanhá-los"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bernardo Castanho Santos Caú" }]
keywords = ["seguranca alimentar", "EBIA", "NOVA", "POF", "PNAD", "Brasil",
            "dados abertos", "transparencia", "agrotoxicos", "PARA", "vigilancia"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0",
  "pyarrow>=14",
  "plotly>=5.18",
]

[project.optional-dependencies]
app = ["streamlit>=1.36"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
